<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คสถานะการเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-10 text-slate-800">
    <div class="max-w-3xl mx-auto bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
        
        <div class="bg-gradient-to-r from-indigo-600 to-blue-500 p-10 text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-white opacity-10 rounded-full blur-xl"></div>
            <div class="absolute bottom-0 left-0 -mb-4 -ml-4 w-20 h-20 bg-white opacity-10 rounded-full blur-lg"></div>
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-3 relative z-10">ระบบติดตามสถานะการเรียน</h1>
            <p class="text-indigo-100 opacity-90 text-sm md:text-base relative z-10">ปีการศึกษา 2569 | set-elearning</p>
        </div>
        
        <div class="p-6 md:p-10">
            <div class="flex flex-col sm:flex-row gap-3 mb-8">
                <input type="text" id="studentId" placeholder="พิมพ์รหัสนักศึกษาของคุณที่นี่..." 
                       class="border-2 border-slate-200 p-4 flex-grow rounded-xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 outline-none transition-all text-lg shadow-sm">
                <button onclick="fetchAndShow()" 
                        class="bg-indigo-600 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-indigo-700 hover:shadow-lg active:scale-95 transition-all duration-200">
                    ค้นหาข้อมูล
                </button>
            </div>

            <div id="result" class="hidden animate-in fade-in duration-500">
                <div class="bg-indigo-50 rounded-2xl p-5 mb-6 border-l-8 border-indigo-500 flex flex-col md:flex-row md:items-center justify-between shadow-sm gap-4">
                    <div class="flex items-center">
                        <div class="bg-white p-2 rounded-full mr-4 shadow-sm">
                            <svg class="w-6 h-6 text-indigo-500" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
                            </svg>
                        </div>
                        <h2 id="studentName" class="text-xl md:text-2xl font-bold text-indigo-900"></h2>
                    </div>
                </div>

                <div class="bg-white border border-slate-200 rounded-2xl p-5 mb-6 shadow-sm">
                    <div class="flex justify-between items-end mb-2">
                        <span class="font-bold text-slate-700">ความคืบหน้าของคุณ</span>
                        <span class="text-2xl font-black text-indigo-600" id="progressText">0%</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-4 mb-4 overflow-hidden border border-slate-200">
                        <div id="progressBar" class="bg-gradient-to-r from-green-400 to-green-500 h-4 rounded-full transition-all duration-1000 ease-out" style="width: 0%"></div>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-4 text-center divide-x divide-slate-100 border-t pt-4">
                        <div>
                            <div class="text-xs text-slate-500 mb-1">ทั้งหมด</div>
                            <div class="text-lg font-bold text-slate-800" id="statTotal">0</div>
                        </div>
                        <div>
                            <div class="text-xs text-green-600 mb-1">เสร็จแล้ว (Done)</div>
                            <div class="text-lg font-bold text-green-600" id="statDone">0</div>
                        </div>
                        <div>
                            <div class="text-xs text-red-500 mb-1">ยังไม่เสร็จ (Not Done)</div>
                            <div class="text-lg font-bold text-red-500" id="statNotDone">0</div>
                        </div>
                    </div>
                </div>
                
                <div class="flex flex-wrap gap-2 mb-4 bg-slate-100 p-2 rounded-xl">
                    <button onclick="renderCourses('all')" id="btn-all" class="flex-1 py-2 px-4 rounded-lg font-semibold text-sm transition-all bg-white text-indigo-700 shadow-sm">ทั้งหมด</button>
                    <button onclick="renderCourses('done')" id="btn-done" class="flex-1 py-2 px-4 rounded-lg font-semibold text-sm transition-all text-slate-600 hover:bg-slate-200">เสร็จแล้ว</button>
                    <button onclick="renderCourses('notdone')" id="btn-notdone" class="flex-1 py-2 px-4 rounded-lg font-semibold text-sm transition-all text-slate-600 hover:bg-slate-200">ยังไม่เสร็จ</button>
                </div>

                <div class="grid grid-cols-1 gap-3" id="courseList">
                    </div>
            </div>
        </div>
    </div>

    <script>
        let currentStudent = null; // เก็บข้อมูลนักศึกษาที่ค้นหาเจอไว้ใช้กับ Filter

        // ให้กดปุ่ม Enter ค้นหาได้
        document.getElementById('studentId').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') fetchAndShow();
        });

        async function fetchAndShow() {
            const id = document.getElementById('studentId').value.trim();
            if(!id) {
                alert('กรุณากรอกรหัสนักศึกษาก่อนครับ');
                return;
            }

            try {
                // เติม ?t= เพื่อป้องกันไม่ให้เบราว์เซอร์จำข้อมูลเก่าเวลาคุณอัปเดต GitHub
                const res = await fetch('data.json?t=' + new Date().getTime());
                const data = await res.json();
                currentStudent = data.find(s => s.id === id);

                if (currentStudent) {
                    document.getElementById('result').classList.remove('hidden');
                    document.getElementById('studentName').innerText = currentStudent.name;
                    // เริ่มต้นให้แสดง "ทั้งหมด"
                    renderCourses('all'); 
                } else {
                    alert('ไม่พบรหัสนักศึกษานี้ในระบบครับ');
                    document.getElementById('result').classList.add('hidden');
                }
            } catch (error) {
                alert('เกิดข้อผิดพลาดในการโหลดข้อมูล โปรดลองอีกครั้งครับ');
            }
        }

        // ฟังก์ชันวาดรายวิชาตาม Filter
        function renderCourses(filterType) {
            const courseList = document.getElementById('courseList');
            courseList.innerHTML = '';

            let total = 0;
            let doneCount = 0;
            let notDoneCount = 0;

            // วนลูปนับจำนวนและสร้าง HTML
            for (const [course, status] of Object.entries(currentStudent.courses)) {
                total++;
                const isDone = status.toLowerCase().trim().includes('done') && !status.toLowerCase().includes('not');
                
                if (isDone) doneCount++;
                else notDoneCount++;

                // กรองข้อมูล (ถ้าเลือก 'done' แต่ยังไม่เสร็จ ให้ข้ามไป)
                if (filterType === 'done' && !isDone) continue;
                if (filterType === 'notdone' && isDone) continue;

                const badgeColors = isDone 
                    ? 'bg-green-100 text-green-700 border border-green-200' 
                    : 'bg-red-100 text-red-700 border border-red-200';
                
                const icon = isDone 
                    ? `<svg class="w-4 h-4 mr-1.5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>`
                    : `<svg class="w-4 h-4 mr-1.5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>`;

                courseList.innerHTML += `
                    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center bg-white border border-slate-200 p-4 rounded-xl hover:shadow-md hover:border-indigo-200 transition-all duration-200">
                        <span class="text-sm md:text-base font-medium text-slate-700 mb-2 sm:mb-0 pr-4">${course}</span>
                        <span class="inline-flex items-center self-start sm:self-auto ${badgeColors} px-4 py-1.5 rounded-full text-sm font-bold shadow-sm whitespace-nowrap">
                            ${icon} ${status}
                        </span>
                    </div>
                `;
            }

            // อัปเดตตัวเลขสรุป
            document.getElementById('statTotal').innerText = total;
            document.getElementById('statDone').innerText = doneCount;
            document.getElementById('statNotDone').innerText = notDoneCount;

            // คำนวณเปอร์เซ็นต์สำหรับ Progress bar
            const percent = total === 0 ? 0 : Math.round((doneCount / total) * 100);
            
            // ทำให้บาร์ค่อยๆ วิ่งไปหาเปอร์เซ็นต์ที่ถูกต้อง
            setTimeout(() => {
                document.getElementById('progressBar').style.width = percent + '%';
                document.getElementById('progressText').innerText = percent + '%';
            }, 100);

            // เปลี่ยนสีปุ่ม Filter ที่ถูกกด
            updateFilterButtons(filterType);
        }

        function updateFilterButtons(activeFilter) {
            const btns = ['all', 'done', 'notdone'];
            btns.forEach(btn => {
                const el = document.getElementById('btn-' + btn);
                if (btn === activeFilter) {
                    el.className = "flex-1 py-2 px-4 rounded-lg font-semibold text-sm transition-all bg-white text-indigo-700 shadow-sm";
                } else {
                    el.className = "flex-1 py-2 px-4 rounded-lg font-semibold text-sm transition-all text-slate-600 hover:bg-slate-200";
                }
            });
        }
    </script>
</body>
</html>
