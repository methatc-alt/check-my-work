<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คสถานะการเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-10 font-sans">
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        <div class="bg-indigo-600 p-8 text-center">
            <h1 class="text-3xl font-bold text-white mb-2">ระบบติดตามสถานะการเรียน</h1>
            <p class="text-indigo-100 opacity-90">ปีการศึกษา 2569 | set-elearning</p>
        </div>
        
        <div class="p-8">
            <div class="flex flex-col sm:flex-row gap-3 mb-8">
                <input type="text" id="studentId" placeholder="พิมพ์รหัสนักศึกษาของคุณที่นี่..." 
                       class="border-2 border-slate-200 p-3 flex-grow rounded-xl focus:border-indigo-500 focus:outline-none transition-all">
                <button onclick="checkStatus()" 
                        class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-700 hover:shadow-lg active:scale-95 transition-all">
                    ค้นหาข้อมูล
                </button>
            </div>

            <div id="result" class="hidden animate-in fade-in duration-500">
                <div class="bg-indigo-50 rounded-lg p-4 mb-6 border-l-4 border-indigo-500">
                    <h2 id="studentName" class="text-xl font-bold text-indigo-900"></h2>
                </div>
                
                <div class="grid grid-cols-1 gap-3" id="courseList">
                    </div>
            </div>
        </div>
    </div>
</body>

    <script>
        async function checkStatus() {
            const id = document.getElementById('studentId').value;
            const res = await fetch('data.json');
            const data = await res.json();
            const student = data.find(s => s.id === id);

            const resultDiv = document.getElementById('result');
            const courseList = document.getElementById('courseList');
            const nameH2 = document.getElementById('studentName');

            if (student) {
                resultDiv.classList.remove('hidden');
                nameH2.innerText = "ชื่อ: " + student.name;
                courseList.innerHTML = '';
                
                for (const [course, status] of Object.entries(student.courses)) {
    // แก้ตรงนี้: แปลง status เป็นตัวพิมพ์เล็กก่อน แล้วเช็คว่ามีคำว่า 'done' ไหม
    // วิธีนี้จะรองรับทั้ง "Done", "done", "Done " (มีช่องว่าง)
    const isDone = status.toLowerCase().trim().includes('done') && !status.toLowerCase().includes('not');
    
    const color = isDone ? 'text-green-600' : 'text-red-500';
    const statusText = isDone ? 'Done' : 'Not Done'; // หรือจะใช้ status เดิมก็ได้ครับ

    courseList.innerHTML += `
        <div class="flex justify-between border-b py-2 items-center">
            <span class="text-sm text-gray-700 pr-4">${course}</span>
            <span class="font-bold ${color} whitespace-nowrap">${status}</span>
        </div>
    `;
}
            } else {
                alert('ไม่พบรหัสนักศึกษานี้');
                resultDiv.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
