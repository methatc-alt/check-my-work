<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SET e-Learning Course Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root{
  --navy:#16285C; --navy-2:#22397A; --navy-soft:#E8ECF6;
  --gold:#C9A227; --gold-2:#E2C25A; --gold-soft:#FBF3D9; --gold-ink:#7A5E00;
  --bg:#EEF1F6; --card:#FFFFFF; --line:#E1E6EF; --line-2:#EEF1F6;
  --ink:#1B2236; --muted:#6B7488; --faint:#A3ABBB;
  --green:#15803D; --green-soft:#E4F4EA; --red:#C0262D; --red-soft:#FDECEC;
  --violet:#4B3FA8; --violet-soft:#ECEAFB;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Prompt',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit}
.hidden{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
.hdr{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}
.hdr .in{max-width:860px;margin:0 auto;padding:22px 20px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{cursor:pointer;min-width:0}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.16em;color:#C9D3EC;text-transform:uppercase}
.brand h1{font-size:24px;font-weight:700;letter-spacing:.01em;margin-top:2px;line-height:1.3}
.brand p{font-size:13px;color:#C9D3EC;margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:10px}
.lang{height:38px;min-width:46px;padding:0 12px;border-radius:10px;border:1.5px solid rgba(255,255,255,.35);color:#fff;font-weight:600;font-size:13.5px;letter-spacing:.04em}
.lang:hover{background:rgba(255,255,255,.08)}
.lang:focus-visible,.search button:focus-visible,.chip:focus-visible,.seg button:focus-visible,.pill:focus-visible,.acc-h:focus-visible,.btn:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px}

.search{display:flex;align-items:center;background:#fff;border-radius:12px;padding:4px 4px 4px 14px;border:1.5px solid transparent;transition:border-color .15s, box-shadow .15s}
.search input{border:0;outline:0;font-size:15px;flex:1;min-width:0;background:transparent;color:var(--ink);height:34px}
.search input::placeholder{color:var(--faint)}
.search button{background:var(--gold);color:var(--navy);border-radius:9px;padding:0 18px;height:34px;font-size:14px;font-weight:700;white-space:nowrap}
.search button:hover{background:var(--gold-2)}
.search:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.2)}
.search.mini{width:300px;min-width:0}

/* ---------- landing ---------- */
.landing{max-width:520px;margin:44px auto 0;padding:0 20px}
.lbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 30px 26px;box-shadow:0 1px 2px rgba(22,40,92,.04),0 8px 24px rgba(22,40,92,.06)}
.lbox .kicker{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);padding-bottom:10px;margin-bottom:14px;border-bottom:2px solid var(--gold);display:inline-block}
.landing h2{font-size:21px;font-weight:700;line-height:1.35;color:var(--navy)}
.landing .lead{font-size:14px;color:var(--muted);margin-top:6px}
.landing label{display:block;font-size:13px;font-weight:600;margin:24px 0 8px}
.landing .search{border-color:var(--line);padding:5px 5px 5px 16px}
.landing .search input{font-size:16px;height:42px}
.landing .search button{height:42px;padding:0 22px;font-size:15px;background:var(--navy);color:#fff}
.landing .search button:hover{background:var(--navy-2)}
.landing .search:focus-within{border-color:var(--navy);box-shadow:0 0 0 4px rgba(22,40,92,.12)}
.hint{font-size:12.5px;color:var(--faint);margin-top:8px}
.err{color:var(--red);font-weight:600;font-size:13.5px;margin-top:10px}
.updated-line{text-align:center;font-size:12.5px;color:var(--muted);margin-top:16px}
.loading{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- result ---------- */
.result{padding:24px 0 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(22,40,92,.04)}

.profile{display:flex;gap:24px;align-items:center;padding:22px 24px}
.avatar{position:relative;flex-shrink:0;width:128px;height:128px}
.avatar svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.avatar .ring-track{stroke:var(--line-2)}
.avatar .ring-bar{stroke:var(--navy);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.avatar.full .ring-bar{stroke:var(--gold)}
.avatar .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.avatar .pct{font-size:30px;font-weight:700;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
.avatar .pct small{font-size:16px;font-weight:600}
.avatar .cap{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.04em}
.avatar.full .pct{color:var(--gold-ink)}
.pinfo{flex:1;min-width:0}
.pinfo .nm{font-size:22px;font-weight:700;line-height:1.3;word-break:break-word}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:6px;font-size:13.5px;color:var(--muted)}
.badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:7px;white-space:nowrap}
.badge.sec{background:var(--gold-soft);color:var(--gold-ink)}
.badge.sec.int{background:var(--violet-soft);color:var(--violet)}
.rank{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px 2px 7px;border-radius:7px;background:var(--navy-soft);color:var(--navy)}
.rank .pips{display:inline-flex;gap:2px}
.rank .pips i{width:5px;height:10px;border-radius:2px;background:#C7CFE3}
.rank .pips i.on{background:var(--navy)}
.rank.champ{background:var(--gold-soft);color:var(--gold-ink)}
.rank.champ .pips i.on{background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{padding:10px 14px}
.stat+.stat{border-left:1px solid var(--line)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.stat .v.g{color:var(--green)}.stat .v.r{color:var(--red)}
.stat .v small{font-size:14px;color:var(--muted);font-weight:500}
.stat .s{font-size:11.5px;color:var(--faint);margin-top:1px}

.next{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px 18px;background:var(--navy);color:#fff;border-radius:var(--radius)}
.next .arrow{width:36px;height:36px;border-radius:10px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700}
.next .tx{flex:1;min-width:0}
.next .k{font-size:12px;color:#C9D3EC}
.next .v{font-size:15px;font-weight:600;line-height:1.4}
.next .tag{font-size:12px;color:#DCE3F4;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:3px 10px;border-radius:8px;white-space:nowrap}
.next.champ{background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 100%)}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0 12px}
.seg{display:inline-flex;background:#E3E8F1;border-radius:11px;padding:3px}
.seg button{padding:6px 14px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 3px rgba(22,40,92,.12)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{width:32px;height:32px;border-radius:9px;font-size:13.5px;font-weight:700;background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.pill.done{background:var(--green-soft);border-color:#BFE3CB;color:var(--green)}
.pill[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.pill.done[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}

.sect{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 10px}
.sect h3{font-size:16px;font-weight:700}
.sect span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border-radius:10px;background:var(--green-soft);border:1px solid #BFE3CB;color:var(--green);font-size:13.5px;font-weight:600}
.chip .ok{width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chip[aria-expanded="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.chip[aria-expanded="true"] .ok{background:#fff;color:var(--green)}

.acc{margin-top:10px;overflow:hidden}
.acc-h{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;text-align:left}
.acc-h:hover{background:#FAFBFD}
.num{width:38px;height:38px;border-radius:10px;background:var(--navy-soft);color:var(--navy);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.acc.open .num{background:var(--navy);color:#fff}
.acc.full .num{background:var(--green-soft);color:var(--green)}
.acc.full.open .num{background:var(--green);color:#fff}
.acc-mid{flex:1;min-width:0}
.acc-t{font-size:15px;font-weight:700}
.acc-t small{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.segbar{display:flex;gap:3px;margin-top:8px}
.segbar i{flex:1;height:6px;border-radius:3px;background:#E3E8F1}
.segbar i.on{background:var(--green)}
.acc-r{text-align:right;flex-shrink:0;min-width:70px}
.acc-r b{font-size:16px;font-variant-numeric:tabular-nums}
.acc-r div{font-size:12px;font-weight:600;color:var(--red)}
.acc.full .acc-r div{color:var(--green)}
.chev{width:18px;height:18px;flex-shrink:0;color:var(--faint);transition:transform .2s}
.acc.open .chev{transform:rotate(180deg)}
.acc-b{border-top:1px solid var(--line-2);padding:4px 18px 8px 70px}
.crs{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.crs:last-child{border-bottom:0}
.box{width:20px;height:20px;border-radius:6px;border:2px solid #C7CFDD;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.crs.done .box{background:var(--green);border-color:var(--green);color:#fff}
.crs .code{font-weight:700;width:78px;flex-shrink:0;font-variant-numeric:tabular-nums}
.crs .cn{flex:1;min-width:0;color:#3B4357}
.crs .mins{font-size:12px;color:var(--faint);white-space:nowrap}
.crs.done .code,.crs.done .cn{color:var(--faint)}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}

.pending{padding:22px 24px;margin-top:14px;display:flex;gap:14px;align-items:flex-start;border-left:4px solid var(--gold)}
.pending b{display:block;font-size:15px}
.pending p{font-size:14px;color:var(--muted);margin-top:2px}

.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-size:13.5px;font-weight:600;color:var(--navy)}
.btn:hover{border-color:var(--navy)}
.note{text-align:center;color:var(--faint);font-size:12px;padding:26px 20px 34px}

/* ---------- responsive ---------- */
@media (max-width:720px){
  .hdr .in{padding:16px 16px 18px;gap:12px}
  .brand h1{font-size:19px}
  .hdr .in{position:relative}
  .brand{padding-right:60px}
  .lang{position:absolute;top:16px;right:16px}
  .hdr-right{width:100%;min-width:0}
  .hdr-right:has(.search.hidden){height:0;margin-top:-12px}
  .search.mini{flex:1;width:auto}
  .wrap{padding:0 14px}
  .profile{flex-direction:column;text-align:center;padding:22px 16px 18px;gap:14px}
  .meta{justify-content:center}
  .stats{text-align:center}
  .stat{padding:8px 6px}
  .stat .v{font-size:19px}
  .next{padding:12px 14px}
  .next .tag{display:none}
  .toolbar{flex-direction:column;align-items:stretch}
  .seg{display:flex}.seg button{flex:1}
  .pills{justify-content:space-between}
  .acc-h{padding:12px 14px;gap:10px}
  .num{width:32px;height:32px;font-size:14px}
  .acc-t small{display:block;margin-left:0}
  .acc-b{padding:2px 14px 8px}
  .crs{font-size:13px;gap:10px}
  .crs .code{width:68px}
  .crs .mins{display:none}
  .landing{margin-top:26px}
  .avatar{width:116px;height:116px}.avatar svg.ring{width:116px;height:116px}
  .lbox{padding:24px 18px 22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- print / PDF ---------- */
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hdr{border-bottom-width:3px}
  .hdr .in{padding:12px 0}
  .hdr-right,.toolbar,.foot .btn,.note,.chev,#landing,.sect span[data-i18n="tapHint"]{display:none!important}
  .wrap{max-width:none;padding:0}
  .result{padding:14px 0 0}
  .card{box-shadow:none}
  .acc{break-inside:avoid}
  .acc-b{display:block!important}
  .chips-detail{display:none!important}
  #completedChips{display:none!important}
  #completedPrint{display:block!important}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="in">
    <div class="brand" id="brand" role="link" tabindex="0">
      <div class="eyebrow">SET e-Learning Portal</div>
      <h1 data-i18n="title"></h1>
      <p data-i18n="subtitle"></p>
    </div>
    <div class="hdr-right">
      <form class="search mini hidden" id="searchMini" autocomplete="off" role="search">
        <input id="idMini" inputmode="numeric" data-i18n-ph="searchOther" aria-label="Student ID">
        <button type="submit" data-i18n="search"></button>
      </form>
      <button class="lang" id="langBtn" type="button" aria-label="Switch language"></button>
    </div>
  </div>
</header>

<main>
  <!-- Landing -->
  <section class="landing" id="landing">
    <div class="lbox">
      <div class="kicker" data-i18n="kicker"></div>
      <h2 data-i18n="landTitle"></h2>
      <p class="lead" data-i18n="landLead"></p>
      <label for="idMain" data-i18n="idLabel"></label>
      <form class="search" id="searchMain" autocomplete="off" role="search">
        <input id="idMain" inputmode="numeric" placeholder="683320001-9">
        <button type="submit" id="searchMainBtn" data-i18n="search"></button>
      </form>
      <div class="hint" data-i18n="hint"></div>
      <div class="err hidden" id="err" role="alert"></div>
    </div>
    <p class="updated-line" id="updatedLanding"></p>
  </section>

  <!-- Result -->
  <section class="result hidden" id="result">
    <div class="wrap">
      <div class="card profile">
        <div class="avatar" id="avatar">
          <svg class="ring" viewBox="0 0 128 128" width="128" height="128" aria-hidden="true">
            <circle class="ring-track" cx="64" cy="64" r="58" fill="none" stroke-width="8"/>
            <circle class="ring-bar" id="ringBar" cx="64" cy="64" r="58" fill="none" stroke-width="8" stroke-linecap="round"/>
          </svg>
          <div class="center"><div class="pct" id="pctPill">0%</div><div class="cap" data-i18n="completeCap"></div></div>
        </div>
        <div class="pinfo">
          <div class="nm" id="pName"></div>
          <div class="meta" id="pMeta"></div>
          <div class="stats" id="stats"></div>
        </div>
      </div>

      <div id="nextWrap"></div>
      <div id="pendingWrap"></div>

      <div id="taskArea">
        <div class="toolbar">
          <div class="seg" id="seg" role="group"></div>
          <div class="pills" id="pills" role="group"></div>
        </div>
        <div id="completedSect">
          <div class="sect"><h3 data-i18n="completedTasks"></h3><span id="completedCount"></span></div>
          <div class="chips" id="completedChips"></div>
          <div id="completedDetail" class="chips-detail"></div>
          <div id="completedPrint" class="hidden"></div>
        </div>
        <div id="openSect">
          <div class="sect"><h3 data-i18n="openTasks"></h3><span data-i18n="tapHint"></span></div>
          <div id="openList"></div>
        </div>
      </div>

      <div class="foot">
        <span id="updatedResult"></span>
        <button class="btn" id="pdfBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
          <span data-i18n="pdf"></span>
        </button>
      </div>
    </div>
  </section>
</main>

<p class="note" data-i18n="footNote"></p>

<script>
// =====================================================================
//  Settings: the Google Sheet must be shared as "Anyone with the link can view"
// =====================================================================
const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1_Raw0wHWBngzQoks30RNWFBISe1O5IyOE7SKK0-_Dxk/edit";
const STUDENTS_TAB = "Students";
const COURSES_TAB  = "Courses";
const INFO_TAB     = "Info";
// =====================================================================

const I18N = {

    footNote: "Data is read from Google Sheets. If anything looks wrong, please contact the course administrator.",
    langBtn: "TH", langLabel: "เปลี่ยนเป็นภาษาไทย"
  },
  th: {
    title: "ตรวจสถานะคอร์สเรียน",
    subtitle: "ภาควิชาเศรษฐศาสตร์ · ปีการศึกษา 2569",
    search: "ค้นหา", searchOther: "ค้นหารหัสอื่น",
    kicker: "ระบบตรวจสอบผลการเรียน",
    completeCap: "สำเร็จ",
    landTitle: "ตรวจสอบสถานะการเรียนรายวิชา SET e-Learning",
    landLead: "กรอกรหัสนักศึกษาเพื่อดูรายวิชาที่ผ่านแล้วและรายวิชาที่ยังเหลือ",
    idLabel: "รหัสนักศึกษา", hint: "ใส่ขีด (-) หรือไม่ใส่ก็ได้",
    notFound: "ไม่พบรหัสนี้ ลองตรวจสอบอีกครั้ง",
    loadFail: "โหลดข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง",
    passed: "ผ่านแล้ว", remaining: "ยังเหลือ", tasksDone: "Task ครบ",
    courses: "คอร์ส", hoursLeft: h => `เนื้อหาที่เหลือประมาณ ${h} ชม.`,
    allDoneShort: "ไม่มีคอร์สค้าง",
    nextLabel: "คอร์สถัดไปที่ควรเรียน",
    nextTag: (t, n) => `${t} · เหลือ ${n} คอร์ส`,
    champLabel: "สถานะ", champText: "ผ่านครบทุกรายวิชาที่กำหนดแล้ว",
    filterAll: "ทั้งหมด", filterOpen: "ยังไม่ครบ", filterDone: "ครบแล้ว",
    filterTask: n => `ดูเฉพาะ Task ${n}`,
    completedTasks: "Task ที่ครบแล้ว", openTasks: "Task ที่ยังไม่ครบ",
    tapHint: "แตะเพื่อดูรายวิชา",
    tasksCount: n => `${n} Task`,
    left: n => `เหลือ ${n} คอร์ส`, complete: "ครบแล้ว",
    noOpen: "ครบทุก Task แล้ว", noDone: "ยังไม่มี Task ที่ครบ",
    min: "นาที",
    pendingTitle: "ยังไม่มีข้อมูลสถานะ",
    pendingText: "ยังไม่ได้ตรวจสถานะคอร์สของรหัสนี้ กลับมาดูอีกครั้งหลังอัปเดตรอบถัดไป หรือติดต่อผู้ดูแลรายวิชา",
    updated: v => `ข้อมูลอัปเดตล่าสุด: ${v}`,
    pdf: "บันทึกเป็น PDF",
    rank: "ระดับ",
    ranks: ["เริ่มต้นการเดินทาง", "มือใหม่", "กำลังไปได้สวย", "เกินครึ่งทางแล้ว", "ใกล้เส้นชัย", "ผ่านครบทุกคอร์ส"],
    footNote: "ข้อมูลอ่านจาก Google Sheets ถ้าข้อมูลไม่ตรง ติดต่อผู้ดูแลรายวิชา",
    langBtn: "EN", langLabel: "Switch to English"
  }
};

let lang = "en";
try { const s = localStorage.getItem("lang"); if (s === "th" || s === "en") lang = s; } catch (e) {}
const T = k => I18N[lang][k];

// ---------------------------------------------------------------------
//  Google Sheets data
// ---------------------------------------------------------------------
const CODE_RE = /[A-Z]{2,4}\d{3,4}/;
function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ","){ row.push(cell); cell = ""; }
    else if (ch === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (ch !== "\r") cell += ch;
  }
  if (cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim()));
}
function csvUrl(tab){
  const m = GOOGLE_SHEET_URL.match(/\/d\/([a-zA-Z0-9-_]+)/);
  const id = m ? m[1] : GOOGLE_SHEET_URL.trim();
  return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&t=${Date.now()}`;
}
async function fetchCsv(tab){
  const res = await fetch(csvUrl(tab));
  if (!res.ok) throw new Error(tab);
  return parseCSV(await res.text());
}
// Courses: Task | Topic | Duration | Code | CourseName | Minutes
function parseCourses(rows){
  const tasks = {}, course = {};
  for (const r of rows.slice(1)){
    const [task, topic, , code, name, minutes] = r;
    if (!task || !code) continue;
    const c = code.toUpperCase().trim();
    if (!tasks[task]) tasks[task] = { topic: topic || "", codes: [] };
    tasks[task].codes.push(c);
    course[c] = { name: name || "", minutes: Number(minutes) || 0 };
  }
  return { tasks, course };
}
// Students: header row starting with "StudentID", then StudentID | Name | Sec | course codes…
function parseStudents(rows){
  const norm = v => (v || "").toLowerCase().replace(/\s/g, "");
  let h = rows.findIndex(r => norm(r[0]).includes("studentid"));
  if (h < 0) h = 0;
  const header = rows[h] || [];
  const col = key => header.findIndex(c => norm(c) === key);
  const nameCol = col("name") >= 0 ? col("name") : 1;
  const secCol = col("sec");
  const courseCols = [];
  header.forEach((c, i) => {
    const m = (c || "").toUpperCase().match(CODE_RE);
    if (m && i !== 0 && i !== nameCol && i !== secCol) courseCols.push([i, m[0]]);
  });
  return rows.slice(h + 1).filter(r => r[0] && /\d/.test(r[0])).map(r => {
    const status = {};
    for (const [i, code] of courseCols) status[code] = r[i] || "";
    return { id: r[0], name: r[nameCol] || "", sec: secCol >= 0 ? (r[secCol] || "") : "", status };
  });
}
// Info: Key | Value
function parseInfo(rows){
  const info = {};
  for (const r of rows) if (r[0]) info[r[0].toLowerCase().replace(/\s/g, "")] = r[1] || "";
  return info;
}
function isDone(v){
  const s = String(v || "").toLowerCase().trim();
  if (!s || s.includes("not") || s.includes("ไม่")) return false;
  return s.includes("done") || s === "true" || s === "✓" || s === "/" || s.includes("ผ่าน") || s.includes("เสร็จ");
}

let DATA = null, loadedAt = 0, loadingPromise = null;
function loadAll(force){
  if (!force && DATA && Date.now() - loadedAt < 5 * 60 * 1000) return Promise.resolve(DATA);
  if (loadingPromise) return loadingPromise;
  loadingPromise = Promise.all([
    fetchCsv(COURSES_TAB), fetchCsv(STUDENTS_TAB), fetchCsv(INFO_TAB).catch(() => [])
  ]).then(([c, s, i]) => {
    DATA = { ...parseCourses(c), students: parseStudents(s), info: parseInfo(i) };
    loadedAt = Date.now();
    return DATA;
  }).finally(() => { loadingPromise = null; });
  return loadingPromise;
}

// ---------------------------------------------------------------------
//  State + rendering
// ---------------------------------------------------------------------
let student = null;          // current student object
let filter = "all";          // all | open | done | task:<name>
let openTask = null;         // expanded task (in-progress list)
let openDoneChip = null;     // expanded completed chip
const celebrated = new Set();
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const taskNum = name => (String(name).match(/\d+/) || [""])[0];
const CHECK = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const CHEV = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;

function buildTasks(st){
  const out = [], used = new Set();
  for (const [name, info] of Object.entries(DATA.tasks)){
    const list = info.codes.filter(c => c in st.status).map(c => {
      used.add(c);
      return { code: c, name: (DATA.course[c] || {}).name || "", minutes: (DATA.course[c] || {}).minutes || 0, done: isDone(st.status[c]) };
    });
    if (list.length) out.push({ name, topic: info.topic, list });
  }
  const others = Object.keys(st.status).filter(c => !used.has(c))
    .map(c => ({ code: c, name: "", minutes: 0, done: isDone(st.status[c]) }));
  if (others.length) out.push({ name: lang === "th" ? "อื่นๆ" : "Other", topic: "", list: others });
  out.forEach(t => { t.done = t.list.filter(c => c.done).length; t.total = t.list.length; t.full = t.done === t.total; });
  return out;
}
function hasData(st){ return Object.values(st.status).some(v => String(v).trim() !== ""); }
function rankIndex(pct, done){
  if (pct >= 100) return 5;
  if (done === 0) return 0;
  if (pct < 25) return 1;
  if (pct < 50) return 2;
  if (pct < 75) return 3;
  return 4;
}

function applyStaticText(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { const v = T(el.dataset.i18n); if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = T(el.dataset.i18nPh); });
  $("langBtn").textContent = T("langBtn");
  $("langBtn").setAttribute("aria-label", T("langLabel"));
  document.title = lang === "th" ? "ตรวจสถานะคอร์ส SET e-Learning" : "SET e-Learning Course Status";
  renderUpdated();
}
function renderUpdated(){
  const v = DATA && (DATA.info.lastupdated || DATA.info["last_updated"] || DATA.info.updated);
  const text = v ? T("updated")(esc(v)) : "";
  $("updatedLanding").innerHTML = text;
  $("updatedResult").innerHTML = text;
}

function render(){
  if (!student) return;
  const pending = !hasData(student);
  const tasks = buildTasks(student);
  const total = tasks.reduce((a, t) => a + t.total, 0);
  const done = pending ? 0 : tasks.reduce((a, t) => a + t.done, 0);
  const pct = total && !pending ? Math.round(done * 100 / total) : 0;
  const fullTasks = tasks.filter(t => t.full).length;
  const minsLeft = tasks.reduce((a, t) => a + t.list.filter(c => !c.done).reduce((b, c) => b + c.minutes, 0), 0);

  // profile + ring
  const C = 2 * Math.PI * 58, bar = $("ringBar");
  bar.style.strokeDasharray = C;
  bar.style.strokeDashoffset = C;
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.strokeDashoffset = C * (1 - pct / 100); }));
  $("avatar").classList.toggle("full", pct >= 100);
  $("pctPill").innerHTML = pending ? "—" : `${pct}<small>%</small>`;

  $("pName").textContent = student.name || student.id;
  const sec = String(student.sec || "").trim().toUpperCase();
  const isInt = sec.startsWith("INT");
  const r = rankIndex(pct, done);
  const pips = [1, 2, 3, 4, 5].map(i => `<i class="${i <= r ? "on" : ""}"></i>`).join("");
  $("pMeta").innerHTML = `<span>${esc(student.id)}</span>` +
    (sec ? `<span class="badge sec ${isInt ? "int" : ""}">Sec ${isInt ? "INT" : esc(sec)}</span>` : "") +
    (pending ? "" : `<span class="rank ${r === 5 ? "champ" : ""}" title="${esc(T("rank"))}"><span class="pips" aria-hidden="true">${pips}</span>${esc(T("rank"))}: ${esc(T("ranks")[r])}</span>`);

  const dash = "—";
  $("stats").innerHTML = `
    <div class="stat"><div class="k">${esc(T("passed"))}</div><div class="v g">${pending ? dash : `${done}<small> / ${total}</small>`}</div></div>
    <div class="stat"><div class="k">${esc(T("remaining"))}</div><div class="v r">${pending ? dash : total - done}</div>
      <div class="s">${pending ? "" : (total - done ? esc(T("hoursLeft")(minsLeft >= 600 ? Math.round(minsLeft / 60) : (minsLeft / 60).toFixed(1))) : esc(T("allDoneShort")))}</div></div>
    <div class="stat"><div class="k">${esc(T("tasksDone"))}</div><div class="v">${pending ? dash : `${fullTasks}<small> / ${tasks.length}</small>`}</div></div>`;

  // pending state
  $("pendingWrap").innerHTML = pending ? `
    <div class="card pending">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div><b>${esc(T("pendingTitle"))}</b><p>${esc(T("pendingText"))}</p></div>
    </div>` : "";
  $("taskArea").classList.toggle("hidden", pending);

  // next course
  const firstOpen = tasks.find(t => !t.full);
  const nextCourse = firstOpen ? firstOpen.list.find(c => !c.done) : null;
  $("nextWrap").innerHTML = pending ? "" : nextCourse ? `
    <div class="next">
      <div class="arrow" aria-hidden="true">→</div>
      <div class="tx"><div class="k">${esc(T("nextLabel"))}</div><div class="v">${esc(nextCourse.code)} · ${esc(nextCourse.name)}</div></div>
      <span class="tag">${esc(T("nextTag")(firstOpen.name, firstOpen.total - firstOpen.done))}</span>
    </div>` : `
    <div class="next champ">
      <div class="arrow" aria-hidden="true">★</div>
      <div class="tx"><div class="k">${esc(T("champLabel"))}</div><div class="v">${esc(T("champText"))}</div></div>
    </div>`;
  if (pending) return;

  // filter controls
  const segs = [["all", "filterAll"], ["open", "filterOpen"], ["done", "filterDone"]];
  $("seg").innerHTML = segs.map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${filter === k}">${esc(T(l))}</button>`).join("");
  $("pills").innerHTML = tasks.map(t => {
    const n = taskNum(t.name) || "•";
    const on = filter === "task:" + t.name;
    return `<button type="button" class="pill ${t.full ? "done" : ""}" data-f="task:${esc(t.name)}" aria-pressed="${on}" title="${esc(T("filterTask")(n))}" aria-label="${esc(T("filterTask")(n))}">${esc(n)}</button>`;
  }).join("");

  const doneTasks = tasks.filter(t => t.full);
  const openTasks = tasks.filter(t => !t.full);
  const single = filter.startsWith("task:") ? tasks.find(t => "task:" + t.name === filter) : null;

  // completed section: chips (or accordions when filtering to completed/single)
  const showDone = filter === "all" || filter === "done" || (single && single.full);
  $("completedSect").classList.toggle("hidden", !showDone);
  $("completedCount").textContent = T("tasksCount")(doneTasks.length);
  if (filter === "all"){
    $("completedChips").innerHTML = doneTasks.length ? doneTasks.map(t =>
      `<button type="button" class="chip" data-chip="${esc(t.name)}" aria-expanded="${openDoneChip === t.name}"><span class="ok">${CHECK}</span>${esc(t.name)} · ${esc(t.topic)}</button>`
    ).join("") : `<span class="hint" style="margin:0">${esc(T("noDone"))}</span>`;
    const chipTask = doneTasks.find(t => t.name === openDoneChip);
    $("completedDetail").innerHTML = chipTask ? accordion(chipTask, true) : "";
  } else {
    const list = single ? [single] : doneTasks;
    $("completedChips").innerHTML = list.length ? "" : `<span class="hint" style="margin:0">${esc(T("noDone"))}</span>`;
    $("completedDetail").innerHTML = list.map(t => accordion(t, single ? true : openTask === t.name)).join("");
  }
  $("completedPrint").innerHTML = doneTasks.map(t => accordion(t, true)).join("");

  // in-progress section
  const showOpen = filter === "all" || filter === "open" || (single && !single.full);
  $("openSect").classList.toggle("hidden", !showOpen);
  const openList = single ? (single.full ? [] : [single]) : openTasks;
  $("openList").innerHTML = openList.length
    ? openList.map(t => accordion(t, single ? true : openTask === t.name)).join("")
    : `<div class="card empty">${esc(T("noOpen"))}</div>`;

  // confetti for a full completion (once per student)
  if (pct >= 100 && !celebrated.has("ALL:" + student.id)){
    celebrated.add("ALL:" + student.id);
    setTimeout(() => burst(true), 450);
  }
}

function accordion(t, open){
  const segs = t.list.map(c => `<i class="${c.done ? "on" : ""}"></i>`).join("");
  const rows = [...t.list].sort((a, b) => a.done - b.done).map(c => `
    <div class="crs ${c.done ? "done" : ""}">
      <span class="box">${c.done ? CHECK : ""}</span>
      <span class="code">${esc(c.code)}</span>
      <span class="cn">${esc(c.name)}</span>
      ${c.minutes ? `<span class="mins">${c.minutes} ${esc(T("min"))}</span>` : ""}
    </div>`).join("");
  const id = "acc-" + t.name.replace(/\W+/g, "");
  return `
  <div class="card acc ${open ? "open" : ""} ${t.full ? "full" : ""}">
    <button type="button" class="acc-h" data-acc="${esc(t.name)}" aria-expanded="${open}" aria-controls="${id}">
      <span class="num">${esc(taskNum(t.name) || "•")}</span>
      <span class="acc-mid">
        <span class="acc-t">${esc(t.name)}<small>${esc(t.topic)}</small></span>
        <span class="segbar" aria-hidden="true">${segs}</span>
      </span>
      <span class="acc-r"><b>${t.done}/${t.total}</b><div>${t.full ? esc(T("complete")) : esc(T("left")(t.total - t.done))}</div></span>
      ${CHEV}
    </button>
    <div class="acc-b ${open ? "" : "hidden"}" id="${id}">${rows}</div>
  </div>`;
}

function burst(big){
  if (typeof confetti !== "function") return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#C9A227", "#E2C25A", "#16285C", "#22397A", "#FFFFFF"];
  if (big){
    confetti({ particleCount: 120, spread: 80, origin: { y: 0.55 }, colors });
    setTimeout(() => confetti({ particleCount: 60, angle: 60, spread: 60, origin: { x: 0, y: 0.7 }, colors }), 250);
    setTimeout(() => confetti({ particleCount: 60, angle: 120, spread: 60, origin: { x: 1, y: 0.7 }, colors }), 400);
  } else {
    confetti({ particleCount: 70, spread: 65, origin: { y: 0.6 }, colors });
  }
}

// ---------------------------------------------------------------------
//  Events
// ---------------------------------------------------------------------
document.addEventListener("click", e => {
  const f = e.target.closest("[data-f]");
  if (f){
    const v = f.dataset.f;
    filter = (filter === v && v.startsWith("task:")) ? "all" : v;
    openTask = null; openDoneChip = null;
    render(); return;
  }
  const chip = e.target.closest("[data-chip]");
  if (chip){
    const name = chip.dataset.chip;
    openDoneChip = openDoneChip === name ? null : name;
    if (openDoneChip && !celebrated.has(name)){ celebrated.add(name); burst(false); }
    render(); return;
  }
  const acc = e.target.closest("[data-acc]");
  if (acc){
    const name = acc.dataset.acc;
    if (filter.startsWith("task:")) return;
    if (filter === "all" && openDoneChip === name){ openDoneChip = null; render(); return; }
    openTask = openTask === name ? null : name;
    render();
  }
});

async function search(raw){
  raw = (raw || "").trim();
  if (!raw) return;
  $("err").classList.add("hidden");
  const btn = $("searchMainBtn");
  btn.innerHTML = `<span class="loading" aria-hidden="true"></span>`;
  try {
    await loadAll(true);
  } catch (ex) {
    btn.textContent = T("search");
    return showError(T("loadFail"));
  }
  btn.textContent = T("search");
  renderUpdated();
  const key = raw.replace(/[-\s]/g, "");
  const s = DATA.students.find(x => String(x.id).replace(/[-\s]/g, "") === key);
  if (!s) return showError(T("notFound"));
  student = s;
  filter = "all"; openDoneChip = null;
  const first = buildTasks(s).find(t => !t.full);
  openTask = first ? first.name : null;
  try { localStorage.setItem("lastStudentId", raw); } catch (ex) {}
  try { history.replaceState(null, "", "?id=" + encodeURIComponent(s.id)); } catch (ex) {}
  $("landing").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("searchMini").classList.remove("hidden");
  $("idMain").value = raw; $("idMini").value = "";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function showError(text){
  goHome();
  $("err").textContent = text;
  $("err").classList.remove("hidden");
}
function goHome(){
  student = null;
  $("result").classList.add("hidden");
  $("landing").classList.remove("hidden");
  $("searchMini").classList.add("hidden");
  $("err").classList.add("hidden");
  try { history.replaceState(null, "", location.pathname); } catch (ex) {}
}
$("searchMain").addEventListener("submit", e => { e.preventDefault(); search($("idMain").value); });
$("searchMini").addEventListener("submit", e => { e.preventDefault(); search($("idMini").value); });
$("brand").addEventListener("click", goHome);
$("brand").addEventListener("keydown", e => { if (e.key === "Enter") goHome(); });
$("langBtn").addEventListener("click", () => {
  lang = lang === "en" ? "th" : "en";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  applyStaticText();
  render();
});
$("pdfBtn").addEventListener("click", () => {
  // print the full picture: every task, completed ones expanded too
  filter = "all"; openDoneChip = null;
  render();
  setTimeout(() => window.print(), 50);
});

// ---------------------------------------------------------------------
//  Start
// ---------------------------------------------------------------------
applyStaticText();
loadAll().then(renderUpdated).catch(() => {});
(function init(){
  const fromUrl = new URLSearchParams(location.search).get("id");
  let last = null;
  try { last = localStorage.getItem("lastStudentId"); } catch (e) {}
  if (fromUrl){ $("idMain").value = fromUrl; search(fromUrl); }
  else if (last) $("idMain").value = last;
})();
</script>
